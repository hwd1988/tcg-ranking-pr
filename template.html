<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ranking TCG de Puerto Rico | Junior, Senior y Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef1f6;--surface:#fff;--text:#121826;--muted:#687489;--border:#e3e8f0;--alt:#f7f9fc;--blue:#0050f0;--red:#ed0000;--shadow:0 20px 50px -20px rgba(18,24,38,.22);--bar:#dfe6fb;--fill:linear-gradient(90deg,#1f4fd8,#4f7bff)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0f17;--surface:#131a26;--text:#eef2f8;--muted:#9da8ba;--border:#283344;--alt:#192333;--shadow:0 18px 48px -18px rgba(0,0,0,.7);--bar:#263551;--fill:linear-gradient(90deg,#3b6cff,#7d9cff)}
*{box-sizing:border-box}html{font-family:Outfit,system-ui,-apple-system,'Segoe UI',sans-serif}body{margin:0;padding:24px 16px 42px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.shell{max-width:820px;margin:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button,.actions select,.actions button{font:inherit;font-size:13px;border:1px solid var(--border);color:var(--text);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer}.tabs button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.search{display:block;width:100%;margin:0 0 14px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;font:inherit;font-size:14px;padding:11px 13px}.card{border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}.accent{height:6px;background:linear-gradient(90deg,var(--blue) 0 22%,var(--red) 22% 100%)}.heading{display:flex;align-items:center;gap:15px;padding:25px 26px 20px}.flag{width:64px;height:43px;flex-shrink:0;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}.flag svg{width:100%;height:100%}.heading h1{margin:0;font-size:clamp(23px,4vw,28px);font-weight:800;line-height:1.1;letter-spacing:-.02em}.subtitle{font-size:13px;color:var(--muted);margin-top:5px}.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:0 26px 23px}.pod{position:relative;border:1px solid var(--border);border-radius:13px;padding:14px 13px;overflow:hidden;min-width:0}.pod:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--medal)}.pod .place{font-size:12px;letter-spacing:.07em;font-weight:800;color:var(--medal);margin-bottom:7px}.pod .name{font-size:16px;font-weight:700;overflow-wrap:anywhere}.pod .alias{font-size:12px;color:var(--muted);margin-top:2px}.pod .points{font-size:27px;font-weight:800;margin-top:10px}.pod .points small{font-size:12px;font-weight:500;color:var(--muted)}.pod .na{font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;text-align:left;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:12px 10px}td{padding:12px 10px;vertical-align:middle}th:first-child,td:first-child{padding-left:26px}th:last-child,td:last-child{padding-right:26px}tbody tr:nth-child(even){background:var(--alt)}.num{text-align:right;font-variant-numeric:tabular-nums}.rank{font-weight:800}.player{font-weight:600}.alias-row{font-size:12px;color:var(--muted)}.barcol{width:24%}.bar{height:8px;background:var(--bar);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--fill);border-radius:20px}.cp{font-weight:800}.empty{padding:34px 22px;color:var(--muted);text-align:center}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:16px 26px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}.foot a{color:var(--blue)}.note{font-size:12px;line-height:1.55;color:var(--muted);padding:12px 3px}.hide-alias .alias-row,.hide-alias .pod .alias{display:none}
@media(max-width:600px){body{padding:14px 10px 30px}.toolbar{align-items:flex-start}.heading{padding:19px 15px}.flag{width:51px;height:34px}.podium{grid-template-columns:1fr;padding:0 15px 16px}.barcol,.nacol{display:none}th:first-child,td:first-child{padding-left:15px}th:last-child,td:last-child{padding-right:15px}.foot{padding:14px 15px}}
</style>
</head>
<body><main class="shell">
<div class="toolbar">
  <div class="tabs" role="tablist" aria-label="División TCG"><button data-div="juniors" role="tab" aria-selected="true">Junior</button><button data-div="seniors" role="tab" aria-selected="false">Senior</button><button data-div="masters" role="tab" aria-selected="false">Master</button></div>
  <div class="actions"><select id="limit" aria-label="Cantidad de jugadores"><option value="0">Todos</option><option value="10">Top 10</option><option value="16">Top 16</option><option value="25">Top 25</option></select><button id="aliases" type="button">Ocultar apodos</button><button id="theme" type="button">Oscuro</button></div>
</div>
<input class="search" type="search" id="search" aria-label="Buscar jugador" placeholder="Buscar jugador...">
<div class="card" id="card"><div class="accent"></div><header class="heading"><div class="flag" aria-label="Bandera de Puerto Rico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><path fill="#ed0000" d="M0 0h30v4H0zm0 8h30v4H0zm0 8h30v4H0z"/><path fill="#0050f0" d="M0 0 17.32 10 0 20Z"/><path fill="#fff" d="m5.77 7.1.68 2.08h2.19l-1.77 1.29.68 2.08-1.78-1.29L4 12.55l.68-2.08L2.91 9.18H5.1Z"/></svg></div><div><h1>Puerto Rico TCG Rankings</h1><div class="subtitle" id="sub">Junior · Championship Points</div></div></header><section class="podium" id="podium"></section><div class="table-wrap" id="results"></div><footer class="foot"><span id="count"></span><span id="updated"></span></footer></div>
<p class="note">Datos de <a href="https://championships.pokemon.com/en-us/competitors/leaderboards/" target="_blank" rel="noopener noreferrer">Play! Pokémon</a>. Ranking independiente de Pokémon Puerto Rico, sin afiliación oficial. Diseño coordinado visualmente con el proyecto VGC de <a href="https://github.com/Pocolip/pr-vgc-leaderboard" target="_blank" rel="noopener noreferrer">Pocolip</a>.</p>
</main>
<script>
const DATA=/*__RANKING_DATA__*/null;
const divisions={juniors:'Junior',seniors:'Senior',masters:'Master'};let current='juniors';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const num=n=>Number(n||0).toLocaleString('es-PR');
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem('pkmnprtcg:'+k);localStorage.setItem('pkmnprtcg:'+k,v)}catch(e){return null}};
function render(){if(!DATA||!DATA.divisions){$('results').innerHTML='<div class="empty">Datos no disponibles.</div>';return;}const all=DATA.divisions[current]||[];const q=$('search').value.trim().toLocaleLowerCase('es');const filtered=all.filter(r=>String(r.name).toLocaleLowerCase('es').includes(q));const max=Math.max(1,...all.map(r=>Number(r.cp)||0));const limit=Number($('limit').value);const shown=limit?filtered.slice(0,limit):filtered;const top=all.slice(0,3);$('sub').textContent=divisions[current]+' · Championship Points';document.querySelectorAll('[data-div]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.div===current)));const medals=['#f2b705','#9aa3b2','#c9773b'];$('podium').innerHTML=top.map((r,i)=>`<article class="pod" style="--medal:${medals[i]}"><div class="place">${i+1}.º lugar</div><div class="name">${esc(r.name)}</div>${r.alias?`<div class="alias">${esc(r.alias)}</div>`:''}<div class="points">${num(r.cp)} <small>CP</small></div><div class="na">#${num(r.region_rank)} Norteamérica</div></article>`).join('');$('results').innerHTML=shown.length?'<table><thead><tr><th>#</th><th>Jugador</th><th class="barcol"></th><th class="num">CP</th><th class="num nacol">Pos. NA</th></tr></thead><tbody>'+shown.map(r=>`<tr><td class="rank">${num(r.rank)}</td><td><div class="player">${esc(r.name)}</div>${r.alias?`<div class="alias-row">${esc(r.alias)}</div>`:''}</td><td class="barcol"><div class="bar"><span style="width:${Math.max(0,Math.min(100,(Number(r.cp)||0)/max*100))}%"></span></div></td><td class="num cp">${num(r.cp)}</td><td class="num nacol">${num(r.region_rank)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">No hay jugadores verificados para esta división o búsqueda. Esto no significa que no existan participantes de Puerto Rico.</div>';$('count').textContent=all.length+' jugadores de Puerto Rico'+(limit&&filtered.length>limit?' · mostrando '+shown.length:'');const d=new Date(DATA.updated_at);$('updated').textContent=isNaN(d)?'':('Actualizado: '+d.toLocaleString('es-PR',{timeZone:'America/Puerto_Rico',dateStyle:'medium',timeStyle:'short'}));}
document.querySelectorAll('[data-div]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.div;pref('division',current);render()}));$('limit').addEventListener('change',()=>{pref('limit',$('limit').value);render()});$('search').addEventListener('input',render);$('aliases').addEventListener('click',()=>{const v=!$('card').classList.contains('hide-alias');$('card').classList.toggle('hide-alias',v);$('aliases').textContent=v?'Mostrar apodos':'Ocultar apodos';pref('alias',v?'1':'0')});$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'Claro':'Oscuro';pref('theme',dark?'dark':'light')});if(pref('theme')==='dark')$('theme').click();if(pref('alias')==='1')$('aliases').click();if(pref('division')&&divisions[pref('division')])current=pref('division');if(pref('limit'))$('limit').value=pref('limit');render();
</script>
</body></html>
